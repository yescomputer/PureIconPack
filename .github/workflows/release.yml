name: Release APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG_NAME#v}"
          IS_PRERELEASE="false"
          if [[ "${TAG_NAME}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not fully configured. Building unsigned release APK."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName="${{ steps.meta.outputs.version_name }}" --no-daemon

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${OUT_DIR}"

          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="PureIconPack-${TAG_NAME}.apk"
          else
            SRC_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            APK_NAME="PureIconPack-${TAG_NAME}-unsigned.apk"
          fi

          if [ ! -f "${SRC_APK}" ]; then
            echo "::error::Expected APK not found at ${SRC_APK}"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          cp "${SRC_APK}" "${OUT_DIR}/${APK_NAME}"
          (cd "${OUT_DIR}" && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

          echo "apk_path=${OUT_DIR}/${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha256_path=${OUT_DIR}/${APK_NAME}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PureIconPack ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha256_path }}
